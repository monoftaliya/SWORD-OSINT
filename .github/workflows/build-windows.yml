name: Build SWORD OSINT

on:
  workflow_dispatch:
  push:
    paths:
      - 'sword-osint.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive ./sword-osint.zip ./project -Force

      - name: Install dependencies
        working-directory: project/sword-osint
        run: npm install

      - name: Build application
        working-directory: project/sword-osint
        run: npm run app:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SWORD-OSINT-EXE
          path: project/sword-osint/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
